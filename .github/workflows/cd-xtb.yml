name: dvmig XTB CD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_to_nuget:
        description: 'Publish the XrmToolBox package to NuGet.org'
        required: true
        default: false
        type: boolean

jobs:
  build-package-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      CONFIGURATION: Release
      PACKAGE_ID: dvmig.XTB
      XTB_BUILD_DIR: publish/xtb-build
      XTB_PACKAGE_DIR: publish/xtb-package

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Set package version
        id: version
        shell: pwsh
        run: |
          $refName = "${{ github.ref_name }}"
          if ($refName -match '^v(?<version>\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?)$') {
            $version = $Matches.version
            $releaseTag = $refName
          } else {
            $now = Get-Date
            $timeSegment = ($now.Hour * 100) + $now.Minute
            $version = '{0}.{1}.{2}.{3}' -f $now.Year, $now.Month, $now.Day, $timeSegment
            $releaseTag = "xtb-$version"
          }

          $assemblyVersion = ($version -split '[-+]')[0]
          if ($assemblyVersion -match '^\d+\.\d+\.\d+$') {
            $assemblyVersion = "$assemblyVersion.0"
          }

          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ASSEMBLY_VERSION=$assemblyVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
          "package_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "release_tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "Package version: $version"
          "Assembly version: $assemblyVersion"
          "Release tag: $releaseTag"

      - name: Restore XTB
        run: dotnet restore src/dvmig.XTB/dvmig.XTB.csproj

      - name: Build XTB
        run: dotnet build src/dvmig.XTB/dvmig.XTB.csproj --configuration $env:CONFIGURATION --no-restore -p:OutDir="$env:GITHUB_WORKSPACE/$env:XTB_BUILD_DIR/" -p:Version=$env:PACKAGE_VERSION -p:AssemblyVersion=$env:ASSEMBLY_VERSION -p:FileVersion=$env:ASSEMBLY_VERSION -p:InformationalVersion=$env:PACKAGE_VERSION

      - name: Stage XTB package content
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE $env:XTB_BUILD_DIR
          $licenseSource = Join-Path $env:GITHUB_WORKSPACE 'LICENSE'
          $readmeSource = Join-Path $env:GITHUB_WORKSPACE 'src/dvmig.XTB/README.md'
          $plugins = Join-Path (Join-Path $env:GITHUB_WORKSPACE $env:XTB_PACKAGE_DIR) 'Plugins'
          $dependencies = Join-Path $plugins "$env:PACKAGE_ID"

          New-Item -ItemType Directory -Force -Path $plugins | Out-Null
          New-Item -ItemType Directory -Force -Path $dependencies | Out-Null
          Copy-Item -Path $licenseSource -Destination (Join-Path $env:GITHUB_WORKSPACE $env:XTB_PACKAGE_DIR 'LICENSE.txt') -Force
          Copy-Item -Path $readmeSource -Destination (Join-Path $env:GITHUB_WORKSPACE $env:XTB_PACKAGE_DIR 'README.md') -Force

          Get-ChildItem -Path $source -File |
            Where-Object {
              $_.Extension -in '.dll', '.config' -and
              $_.Name -notlike 'XrmToolBox*' -and
              $_.Name -ne 'Bogus.dll' -and
              $_.Name -notin @("$env:PACKAGE_ID.dll", "$env:PACKAGE_ID.dll.config")
            } |
            Copy-Item -Destination $dependencies -Force

          Copy-Item -Path (Join-Path $source "$env:PACKAGE_ID.dll") -Destination $plugins -Force
          Copy-Item -Path (Join-Path $source "$env:PACKAGE_ID.dll.config") -Destination $plugins -Force

          Get-ChildItem -Path $plugins -Recurse -File |
            Sort-Object FullName |
            Select-Object FullName, Length

      - name: Pack XTB NuGet package
        run: nuget pack src/dvmig.XTB/dvmig.XTB.nuspec -Version $env:PACKAGE_VERSION -BasePath "$env:GITHUB_WORKSPACE/$env:XTB_PACKAGE_DIR" -OutputDirectory "$env:GITHUB_WORKSPACE/artifacts"

      - name: Package manual install zip
        shell: pwsh
        run: |
          $zip = Join-Path $env:GITHUB_WORKSPACE "artifacts/$env:PACKAGE_ID-$env:PACKAGE_VERSION-manual.zip"
          Compress-Archive -Path "$env:GITHUB_WORKSPACE/$env:XTB_PACKAGE_DIR/Plugins" -DestinationPath $zip -Force

      - name: Verify release artifacts
        shell: pwsh
        run: |
          $nupkg = Join-Path $env:GITHUB_WORKSPACE "artifacts/$env:PACKAGE_ID.$env:PACKAGE_VERSION.nupkg"
          $zip = Join-Path $env:GITHUB_WORKSPACE "artifacts/$env:PACKAGE_ID-$env:PACKAGE_VERSION-manual.zip"

          Get-ChildItem -Path "$env:GITHUB_WORKSPACE/artifacts" -File |
            Sort-Object Name |
            Select-Object Name, Length

          if (-not (Test-Path -LiteralPath $nupkg)) {
            throw "Missing NuGet package artifact: $nupkg"
          }

          if (-not (Test-Path -LiteralPath $zip)) {
            throw "Missing manual install zip artifact: $zip"
          }

      - name: Publish XTB package to NuGet
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_to_nuget == true }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw "NUGET_API_KEY secret is required when publish_to_nuget is true."
          }

          nuget push "artifacts/$env:PACKAGE_ID.$env:PACKAGE_VERSION.nupkg" -ApiKey $env:NUGET_API_KEY -Source https://api.nuget.org/v3/index.json -SkipDuplicate

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.release_tag }}"
          $version = "${{ steps.version.outputs.package_version }}"
          $nupkg = "artifacts/$env:PACKAGE_ID.$version.nupkg"
          $zip = "artifacts/$env:PACKAGE_ID-$version-manual.zip"

          if (gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null) {
            gh release upload $tag $nupkg $zip --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag $nupkg $zip `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title $tag `
              --notes "XrmToolBox release $version"
          }
